{% extends "layouts/main.html" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    <h1 class="govuk-heading-xl">
      {{ serviceName }}
    </h1>

    <p class="govuk-body">Use this service to book a trip to the Moon or Mars.</p>

    {% from "govuk/components/button/macro.njk" import govukButton %}

    {{ govukButton({
    text: "Start now",
    href: "/destination",
    isStartButton: true
    }) }}


  </div>
</div>

{% endblock %}
